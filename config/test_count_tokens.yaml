# count_tokens 功能测试配置
# 创建时间: 2025-10-10 11:20:14

server:
  host: "127.0.0.1"
  port: 8087

# 启用Token计数功能
token_counting:
  enabled: true              # 启用count_tokens支持
  estimation_ratio: 4.0      # 1 token ≈ 4 字符

endpoints_storage:
  type: "sqlite"

# 测试端点需预先在测试 SQLite 数据库中创建，并分别设置 supports_count_tokens。

logging:
  level: "info"

tui:
  enabled: false

web:
  enabled: false

usage_tracking:
  enabled: false
  database:
    type: "sqlite"
    path: "data/test_count_tokens.db"
