# Claude Request Forwarder v4.0 Configuration
# v4.0 新特性: 简化配置 - 移除"组"概念,直接配置端点和故障转移

# 全局时区配置
timezone: "Asia/Shanghai"

# 服务器配置
server:
  host: "0.0.0.0"
  port: 8087

# 路由策略配置
strategy:
  type: "priority"                  # 路由策略: "priority" (优先级) 或 "fastest" (最快响应)
  fast_test_enabled: false          # 启用快速测试 (仅在 fastest 策略下生效)

# 重试配置
retry:
  max_attempts: 3
  base_delay: "1s"
  max_delay: "30s"
  multiplier: 2.0

# 健康检查配置
health:
  check_interval: "30s"
  timeout: "5s"
  health_path: "/v1/models"

# 日志配置
logging:
  level: "info"
  format: "text"

# 流式传输配置
streaming:
  heartbeat_interval: "30s"
  read_timeout: "10s"
  max_idle_time: "120s"
  response_header_timeout: "60s"

# ==================== v4.0 故障转移配置 ====================
# 🆕 v4.0 新配置: 取代旧的 group 配置
# ========================================================
failover:
  enabled: true                    # 启用故障转移，默认: true
  default_cooldown: "10m"          # 默认冷却时间，默认: 10m

# 请求挂起配置
request_suspend:
  enabled: false
  timeout: "300s"
  max_suspended_requests: 100

# 全局超时配置
global_timeout: "300s"

# 鉴权配置
auth:
  enabled: false

# TUI界面配置
tui:
  enabled: false
  update_interval: "2s"

# Web界面配置
web:
  enabled: true
  host: "0.0.0.0"
  port: 8088

# Token计数配置
token_counting:
  enabled: true
  estimation_ratio: 4.0

# Claude 端点只从 SQLite 读取，通过桌面端管理。
endpoints_storage:
  type: "sqlite"

# 使用跟踪配置
usage_tracking:
  enabled: false
  database:
    type: "sqlite"
    path: "data/usage.db"

  # 🆕 v4.1 热池配置（可选，默认启用）
  # 热池架构将活跃请求保持在内存中，只在完成时写入数据库
  # 优势: 减少80%数据库写入，提升100x实时查询性能
  hot_pool:
    enabled: true              # 是否启用热池模式，默认: true
    max_age: "30m"             # 请求最大存活时间，超时自动归档，默认: 30m
    max_size: 10000            # 热池最大容量，默认: 10000
    cleanup_interval: "1m"     # 僵尸请求清理间隔，默认: 1m
    archive_on_cleanup: true   # 清理时是否归档到数据库，默认: true

# 端点的优先级、硬启用、自动调度、冷却与认证信息均保存在 SQLite。
# 旧 YAML endpoints/group/多凭据数组只用于首次升级迁移，迁移成功后不再是运行时事实源。
